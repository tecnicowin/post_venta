<!DOCTYPE html>

  <title>Debug Scripts</title>
</head>
<body>
  <div id="output"></div>
  <script>
    const log = (msg) => {
      const d = document.getElementById('output');
      d.innerHTML += msg + '<br>';
      console.log(msg);
    };
    window.onerror = (msg, url, line) => {
      log('❌ ERROR: ' + msg + ' at ' + url + ':' + line);
      return false;
    };
  </script>
  <script>log('1. utils.js loading...');</script>
